[project]
name = "champions-practice-bot"
version = "0.1.0"
description = "Offline Pokemon Champions doubles practice opponent"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "poke-env>=0.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
champions-practice = "champions_practice.cli:main"
champions-demo = "champions_practice.demo_server:main"
champions-replays = "champions_practice.replay_corpus:main"
champions-trajectories = "champions_practice.replay_trajectories:main"
champions-replay-audit = "champions_practice.replay_semantic_audit:main"
champions-policy-train = "champions_practice.semantic_policy_train:main"
champions-policy-tools = "champions_practice.semantic_policy_tools:main"
champions-teams = "champions_practice.team_corpus:main"
champions-recovery-corpus = "champions_practice.recovery_corpus:main"
champions-strength-league = "champions_practice.strength_league:main"
champions-structural-collapse = "champions_practice.structural_collapse_probe:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/champions_practice"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
