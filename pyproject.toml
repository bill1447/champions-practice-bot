[project]
name = "champions-practice-bot"
version = "0.1.0"
description = "Offline Pokemon Champions doubles practice opponent"
requires-python = ">=3.12,<3.13"
dependencies = [
    "poke-env>=0.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
champions-practice = "champions_practice.cli:main"\nchampions-demo = "champions_practice.demo_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/champions_practice"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
