name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-integration:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out practice bot
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Create Python environment
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -e ".[dev]"

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $AllErrors = @()
          foreach ($Script in Get-ChildItem -Path . -Filter *.ps1 -Recurse) {
            $Tokens = $null
            $Errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $Script.FullName,
              [ref]$Tokens,
              [ref]$Errors
            ) | Out-Null
            foreach ($ParseError in $Errors) {
              $AllErrors += "$($Script.FullName): $($ParseError.Message)"
            }
          }

          if ($AllErrors.Count -gt 0) {
            $AllErrors | ForEach-Object { Write-Error $_ }
            throw "PowerShell syntax validation failed."
          }

      - name: Sync pinned Pokemon Showdown
        shell: pwsh
        run: |
          . .\scripts\showdown-utils.ps1
          Sync-ChampionsShowdownCheckout -CloneIfMissing

      - name: Install and build Pokemon Showdown
        shell: pwsh
        run: |
          Push-Location external/pokemon-showdown
          try {
            npm ci
            npm run build
            Copy-Item config/config-example.js config/config.js -Force
          }
          finally {
            Pop-Location
          }

          . .\scripts\showdown-utils.ps1
          Set-ChampionsShowdownLocalConfig
          .\.venv\Scripts\python.exe -m champions_practice.showdown_build_stamp

      - name: Runtime Showdown pin gate
        shell: pwsh
        run: .\showdown-runtime-gate.ps1

      - name: Verify Showdown localhost-only binding
        shell: pwsh
        run: |
          .\start-showdown.ps1
          . .\scripts\showdown-utils.ps1
          $Addresses = @(Get-ChampionsListeningAddresses)
          if (-not (Test-ChampionsShowdownLoopbackOnlyBinding)) {
            throw "Showdown is not loopback-only: $($Addresses -join ', ')"
          }
          Write-Host "Verified loopback-only listener: $($Addresses -join ', ')"

      - name: Lint
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m ruff check src tests

      - name: Unit tests
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m pytest

      - name: Public replay trajectory extraction smoke test
        shell: pwsh
        run: .\replay-trajectory-smoke.ps1

      - name: Pinned Showdown replay legal-menu adapter smoke test
        shell: pwsh
        run: .\replay-policy-menu-smoke.ps1

      - name: Pinned Showdown replay semantic audit smoke test
        shell: pwsh
        run: .\replay-semantic-audit-smoke.ps1

      - name: Validate Champions team
        shell: pwsh
        run: .\validate-team.ps1

      - name: Exact Showdown state fork smoke test
        shell: pwsh
        run: .\fork-smoke.ps1

      - name: Python to Showdown search bridge smoke test
        shell: pwsh
        run: .\bridge-smoke.ps1

      - name: Pinned Showdown team corpus validation smoke test
        shell: pwsh
        run: .\team-corpus-smoke.ps1

      - name: Persistent battle session smoke test
        shell: pwsh
        run: .\session-smoke.ps1

      - name: Public-information belief privacy smoke test
        shell: pwsh
        run: .\belief-smoke.ps1

      - name: Sequential observation-conditioning smoke test
        shell: pwsh
        run: .\observation-conditioning-smoke.ps1

      - name: Independent-RNG observation-conditioning smoke test
        shell: pwsh
        run: .\rng-observation-smoke.ps1

      - name: Persistent public opponent ledger smoke test
        shell: pwsh
        run: .\public-ledger-smoke.ps1

      - name: Authoritative public event conditioning smoke test
        shell: pwsh
        run: .\public-event-conditioning-smoke.ps1

      - name: Public sethp projection consistency smoke test
        shell: pwsh
        run: .\sethp-projection-smoke.ps1

      - name: Isolated mechanics-authoritative recovery boundary smoke test
        shell: pwsh
        run: .\recovery-boundary-smoke.ps1

      - name: Typed recovery mutation authority smoke test
        shell: pwsh
        run: .\recovery-mutation-authority-smoke.ps1

      - name: Pre-opening static recovery authority smoke test
        shell: pwsh
        run: .\recovery-opening-authority-smoke.ps1

      - name: Recovery RNG sampling authority smoke test
        shell: pwsh
        run: .\recovery-sampling-inconclusive-smoke.ps1

      - name: Stable recovery member-lineage smoke test
        shell: pwsh
        run: .\recovery-member-lineage-smoke.ps1

      - name: Static recovery prefix authority smoke test
        shell: pwsh
        run: .\recovery-history-authority-smoke.ps1

      - name: Bounded opponent stat-point recovery smoke test
        shell: pwsh
        run: .\recovery-stat-proposal-smoke.ps1


      - name: Mechanics-authoritative reachability authority smoke test
        shell: pwsh
        run: .\reachability-smoke.ps1

      - name: Offline true-world recovery soundness smoke test
        shell: pwsh
        run: .\recovery-soundness-smoke.ps1

      - name: Deterministic exact-team recovery corpus smoke test
        shell: pwsh
        run: .\recovery-corpus-smoke.ps1

      - name: Finite Showdown damage-roll domain smoke test
        shell: pwsh
        run: .\damage-roll-domain-smoke.ps1

      - name: Pinned damage-roll conditioning witness smoke test
        shell: pwsh
        run: .\\.venv\\Scripts\\python.exe -m champions_practice.damage_witness_smoke

      - name: Finite stochastic transition reachability smoke test
        shell: pwsh
        run: .\finite-transition-smoke.ps1

      - name: Finite stochastic belief conditioning smoke test
        shell: pwsh
        run: .\finite-conditioning-smoke.ps1

      - name: Quantitative public transition authority smoke test
        shell: pwsh
        run: .\quantitative-transition-smoke.ps1

      - name: Public selected-switch action smoke test
        shell: pwsh
        run: .\public-switch-action-smoke.ps1

      - name: Public transformation command reconstruction smoke test
        shell: pwsh
        run: .\public-transformation-action-smoke.ps1

      - name: Public action execution evidence smoke test
        shell: pwsh
        run: .\execution-evidence-smoke.ps1

      - name: Ordered both-side execution authority smoke test
        shell: pwsh
        run: .\execution-authority-smoke.ps1

      - name: Persistent belief battle controller smoke test
        shell: pwsh
        run: .\belief-controller-smoke.ps1

      - name: Sealed forced-switch and terminal smoke test
        shell: pwsh
        run: .\sealed-transition-smoke.ps1

      - name: Revival Blessing request and conditioning smoke test
        shell: pwsh
        run: .\revival-blessing-smoke.ps1

      - name: Exact forced-wait authority smoke test
        shell: pwsh
        run: .\forced-wait-authority-smoke.ps1

      - name: Production-like damaging-turn conditioning smoke test
        shell: pwsh
        run: .\damage-conditioning-smoke.ps1

      - name: Absolute deadline lifecycle smoke test
        shell: pwsh
        run: .\timeout-lifecycle-smoke.ps1

      - name: Worker startup, transport, and ownership hardening smoke test
        shell: pwsh
        run: .\worker-lifecycle-hardening-smoke.ps1

      - name: Belief-aware exact search smoke test
        shell: pwsh
        run: .\belief-search-smoke.ps1

      - name: Executable strategic benchmark smoke test
        shell: pwsh
        run: .\strategic-benchmark-smoke.ps1

      - name: Exact one-ply search smoke test
        shell: pwsh
        run: .\exact-search-smoke.ps1

      - name: Hidden-state legality oracle smoke test
        shell: pwsh
        run: .\legality-oracle-smoke.ps1

      - name: Public structural target legality smoke test
        shell: pwsh
        run: .\public-structural-legality-smoke.ps1

      - name: Persistent-session legal action smoke test
        shell: pwsh
        run: .\legal-actions-smoke.ps1

      - name: Bounded exact recommendation smoke test
        shell: pwsh
        run: .\recommendation-smoke.ps1

      - name: Full Champions battle smoke test
        shell: pwsh
        run: .\battle-smoke.ps1

      - name: Heuristic opponent smoke test
        shell: pwsh
        run: .\ai-smoke.ps1

      - name: Capture status and logs
        if: always()
        continue-on-error: true
        shell: pwsh
        run: .\status.ps1 -Logs

      - name: Stop local Showdown
        if: always()
        shell: pwsh
        run: .\stop-showdown.ps1

      - name: Upload integration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: champions-ci-artifacts
          if-no-files-found: ignore
          retention-days: 7
          path: |
            .runtime/
            runs/
